<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Berline's Menfess Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pink-bg:#fff3f8;
    --pink:#ffb8d9;
    --pink-deep:#ff6fa8;
    --blue:#bfe3ff;
    --blue-deep:#6fb3ff;
    --lav:#e8d9ff;
    --ink:#4a3b5c;
    --ink-soft:#8a7a9c;
    --card:#ffffff;
    --line:#f1def0;
    --ok:#4fd1a5;
    --off:#ff8fa3;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{
    margin:0;
    min-height:100%;
    font-family:'Quicksand',sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 6% 12%, rgba(255,184,217,.35) 0, transparent 40%),
      radial-gradient(circle at 94% 18%, rgba(191,227,255,.4) 0, transparent 42%),
      radial-gradient(circle at 50% 100%, rgba(232,217,255,.35) 0, transparent 45%),
      var(--pink-bg);
    background-attachment:fixed;
  }
  body::before{
    content:"";
    position:fixed;inset:0;
    pointer-events:none;
    opacity:.5;
    background-image:
      radial-gradient(circle, var(--pink) 1.6px, transparent 1.6px),
      radial-gradient(circle, var(--blue) 1.6px, transparent 1.6px);
    background-size:52px 52px, 52px 52px;
    background-position:0 0, 26px 26px;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:28px 20px 60px;position:relative;}
  header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:26px;}
  .title{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:clamp(24px,4vw,34px);color:var(--ink);}
  .title span{color:var(--pink-deep);}
  .subtitle{font-size:14px;color:var(--ink-soft);margin-top:2px;}
  .status-pill{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--card);border:2px solid var(--line);
    padding:8px 16px;border-radius:999px;font-weight:700;font-size:13px;
  }
  .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px rgba(79,209,165,.18);}
  .dot.off{background:var(--off);box-shadow:0 0 0 4px rgba(255,143,163,.18);}

  section{margin-bottom:30px;}
  h2{
    font-family:'Baloo 2',sans-serif;font-size:19px;font-weight:700;
    margin:0 0 14px;display:flex;align-items:center;gap:8px;
  }

  .workers{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;}
  .worker{
    background:var(--card);border-radius:18px;padding:16px 16px 14px;
    border:2px solid var(--line);position:relative;overflow:hidden;
  }
  .worker::after{
    content:"";position:absolute;top:-24px;right:-24px;width:60px;height:60px;
    border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--blue));opacity:.35;
  }
  .worker-name{font-weight:700;font-size:15px;margin-bottom:6px;}
  .worker-status{font-size:12px;font-weight:700;letter-spacing:.02em;}
  .worker-status.ready{color:var(--ok);}
  .worker-status.offline{color:var(--off);}
  .worker-note{font-size:12px;color:var(--ink-soft);margin-top:3px;}
  .worker.disabled{opacity:.5;}
  .worker-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .switch{position:relative;width:38px;height:21px;flex:none;z-index:1;}
  .switch input{opacity:0;width:0;height:0;}
  .slider{position:absolute;inset:0;background:#e6d9ec;border-radius:999px;cursor:pointer;transition:.2s;}
  .slider::before{content:"";position:absolute;width:15px;height:15px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
  .switch input:checked + .slider{background:linear-gradient(135deg,var(--pink-deep),var(--blue-deep));}
  .switch input:checked + .slider::before{transform:translateX(17px);}
  #sysToggle{background:var(--card);}

  .wording-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;}
  .wcard{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;}
  .wcard label{display:block;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:14px;margin-bottom:8px;color:var(--pink-deep);}
  .wcard textarea{
    width:100%;min-height:96px;resize:vertical;border-radius:12px;
    border:2px solid var(--line);padding:10px 12px;font-family:'Quicksand',sans-serif;
    font-size:13.5px;color:var(--ink);background:#fffaff;outline:none;
  }
  .wcard textarea:focus{border-color:var(--pink-deep);}
  .save-btn{
    margin-top:10px;border:none;cursor:pointer;
    background:linear-gradient(135deg,var(--pink-deep),var(--blue-deep));
    color:#fff;font-weight:700;font-size:13px;padding:9px 18px;border-radius:999px;
    font-family:'Quicksand',sans-serif;transition:transform .15s ease;
  }
  .save-btn:active{transform:scale(.96);}
  .save-msg{font-size:12px;color:var(--ok);margin-left:10px;opacity:0;transition:opacity .2s;}
  .save-msg.show{opacity:1;}

  .keywords-card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;}
  .keywords-card p{font-size:12.5px;color:var(--ink-soft);margin:0 0 10px;}
  .keywords-card textarea{
    width:100%;height:180px;resize:vertical;border-radius:12px;border:2px solid var(--line);
    padding:12px;font-family:'Quicksand',sans-serif;font-size:13.5px;background:#fffaff;outline:none;
  }
  .keywords-card textarea:focus{border-color:var(--blue-deep);}

  .log-panel{
    background:#2c2440;border-radius:18px;padding:16px;
    border:2px solid var(--lav);max-height:260px;overflow-y:auto;
  }
  .log-line{font-family:ui-monospace,monospace;font-size:12.5px;color:#e6d9ff;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.06);}
  .log-line .time{color:#ff9fc7;margin-right:6px;}
  .log-line .tag{color:#8fd4ff;}

  footer{text-align:center;font-size:12px;color:var(--ink-soft);margin-top:20px;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <div class="title">Berline's <span>Menfess</span> Control</div>
      <div class="subtitle">Dashboard monitoring & wording worker 🩷</div>
    </div>
    <button class="status-pill" id="sysToggle" onclick="toggleSystem()" style="cursor:pointer;border:2px solid var(--line);">
      <span class="dot" id="sysDot"></span><span id="sysText">Sistem online</span>
    </button>
  </header>

  <section>
    <h2>🌸 Worker Telegram</h2>
    <div class="workers" id="workers"></div>
  </section>

  <section>
    <h2>💌 Wording 1–5</h2>
    <div class="wording-grid" id="wordingGrid"></div>
  </section>

  <section>
    <h2>🔎 Keywords</h2>
    <div class="keywords-card">
      <p>Satu keyword per baris. Perubahan dipakai worker tanpa perlu edit Python.</p>
      <textarea id="keywordsBox" placeholder="joktug&#10;joki tugas&#10;makalah..."></textarea>
      <div>
        <button class="save-btn" onclick="saveKeywords()">Simpan Keywords</button>
        <span class="save-msg" id="kwMsg">Tersimpan ✓</span>
      </div>
    </div>
  </section>

  <section>
    <h2>📋 Log Sistem</h2>
    <div class="log-panel" id="logPanel"></div>
  </section>

  <footer>Data wording & keywords disimpan lokal di browser ini.</footer>
</div>

<script>
const WORKER_NOTES = {
  Amela:"Relay aktif", Berline:"Command only",
  Geya:"Siap mengirim", Shazald:"Siap mengirim",
  Bear:"Siap mengirim", Abillo:"Siap mengirim",
};
const WORKER_ORDER = ["Amela","Berline","Geya","Shazald","Bear","Abillo"];

async function api(path, opts){
  const res = await fetch(path, opts);
  return res.json();
}

// Workers
const workersEl = document.getElementById('workers');
async function renderWorkers(){
  const state = await api('/api/workers');
  workersEl.innerHTML = '';
  WORKER_ORDER.forEach(name=>{
    const on = state[name] !== false;
    const el = document.createElement('div');
    el.className = 'worker' + (on ? '' : ' disabled');
    el.innerHTML = `
      <div class="worker-top">
        <div class="worker-name">${name}</div>
        <label class="switch">
          <input type="checkbox" ${on?'checked':''} onchange="toggleWorker('${name}', this.checked)">
          <span class="slider"></span>
        </label>
      </div>
      <div class="worker-status ${on?'ready':'offline'}">${on?'READY':'OFFLINE'}</div>
      <div class="worker-note">${on ? WORKER_NOTES[name] : 'Dimatikan manual'}</div>`;
    workersEl.appendChild(el);
  });
}
async function toggleWorker(name, checked){
  await api(`/api/workers/${name}/toggle`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({on: checked}),
  });
  renderWorkers();
}
renderWorkers();

// Global system toggle
async function renderSystemToggle(){
  const {on} = await api('/api/system');
  document.getElementById('sysDot').classList.toggle('off', !on);
  document.getElementById('sysText').textContent = on ? 'Sistem online' : 'Sistem dimatikan';
  document.getElementById('sysToggle').dataset.on = on;
}
async function toggleSystem(){
  const cur = document.getElementById('sysToggle').dataset.on === 'true';
  await api('/api/system/toggle', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({on: !cur}),
  });
  renderSystemToggle();
}
renderSystemToggle();

// Wording
const grid = document.getElementById('wordingGrid');
async function renderWording(){
  const data = await api('/api/wording'); // {1: "...", 2: "...", ...}
  grid.innerHTML = '';
  for(let i=1;i<=5;i++){
    const text = data[i] || '';
    const card = document.createElement('div');
    card.className='wcard';
    card.innerHTML = `<label>Wording ${i}</label>
      <textarea id="w${i}">${text}</textarea>
      <div><button class="save-btn" onclick="saveWording(${i})">Simpan Wording ${i}</button>
      <span class="save-msg" id="wMsg${i}">Tersimpan ✓</span></div>`;
    grid.appendChild(card);
  }
}
async function saveWording(i){
  const val = document.getElementById('w'+i).value;
  await api(`/api/wording/${i}`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({text: val}),
  });
  flash('wMsg'+i);
}
renderWording();

// Keywords
const kwBox = document.getElementById('keywordsBox');
async function renderKeywords(){
  const {keywords} = await api('/api/keywords');
  kwBox.value = keywords.join('\n');
}
async function saveKeywords(){
  const lines = kwBox.value.split('\n').map(s=>s.trim()).filter(Boolean);
  await api('/api/keywords', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({keywords: lines}),
  });
  flash('kwMsg');
}
renderKeywords();

function flash(id){
  const el = document.getElementById(id);
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 1400);
}

// Log (poll tiap 4 detik)
const logPanel = document.getElementById('logPanel');
async function renderLogs(){
  const logs = await api('/api/logs?limit=50');
  logPanel.innerHTML = '';
  logs.forEach(entry=>{
    const p = document.createElement('div');
    p.className='log-line';
    const t = new Date(entry.ts).toLocaleString('id-ID');
    p.innerHTML = `<span class="time">[${t}]</span><span class="tag">system:</span> ${entry.text}`;
    logPanel.appendChild(p);
  });
  logPanel.scrollTop = logPanel.scrollHeight;
}
renderLogs();
setInterval(renderLogs, 4000);
setInterval(renderWorkers, 8000);
setInterval(renderSystemToggle, 8000);
</script>
</body>
</html>
